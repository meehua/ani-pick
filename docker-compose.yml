name: anipick

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # 按机器规格调整（默认按 1GB 内存机校准）：换大机器时在 .env 提高
    # PG_MAX_CONNECTIONS / PG_SHARED_BUFFERS / PG_EFFECTIVE_CACHE_SIZE
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-256MB}
    environment:
      POSTGRES_DB: ani_pick
      POSTGRES_USER: ani_pick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ani_pick}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ani_pick -d ani_pick"]
      interval: 5s
      timeout: 3s
      retries: 20

  anipick:
    image: ${ANIPICK_IMAGE:-ghcr.io/meehua/ani-pick}:${ANIPICK_IMAGE_TAG:-latest}
    # 本地源码构建：注释掉上面的 image，取消下面一行注释
    # build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ANIPICK_PORT:-8787}:8787"
    environment:
      ANIPICK_ADDR: ":8787"
      # Go 堆内存上限：小内存机器防 OOM（Go GC 到达上限即加速回收），默认 192MiB
      GOMEMLIMIT: "${GOMEMLIMIT:-192MiB}"
      # 容器内必须走 compose 的 postgres 服务，而不是 .env 里的 127.0.0.1
      ANIPICK_DATABASE_URL: "postgres://ani_pick:${POSTGRES_PASSWORD:-ani_pick}@postgres:5432/ani_pick?sslmode=disable"
      ANIPICK_ADMIN_PASSWORD: "${ANIPICK_ADMIN_PASSWORD:-anipick}"
      ANIPICK_SECRET: "${ANIPICK_SECRET:-}"
      ANIPICK_BGM_TOKEN: "${ANIPICK_BGM_TOKEN:-}"
      ANIPICK_BGM_COOKIE: "${ANIPICK_BGM_COOKIE:-}"
      ANIPICK_BGM_UA: "${ANIPICK_BGM_UA:-AniPick/1.0 (+https://github.com/bangumi; local indexer)}"
      ANIPICK_DOH: "${ANIPICK_DOH:-true}"
      ANIPICK_ECH: "${ANIPICK_ECH:-true}"
      ANIPICK_DOH_ENDPOINTS: "${ANIPICK_DOH_ENDPOINTS:-https://dns.alidns.com/resolve,https://1.1.1.1/dns-query}"
      ANIPICK_EGRESS_PROXY: "${ANIPICK_EGRESS_PROXY:-}"
      ANIPICK_CRAWL_TYPES: "${ANIPICK_CRAWL_TYPES:-1,2,3,4,6}"
      ANIPICK_CRAWL_PAGE_SIZE: "${ANIPICK_CRAWL_PAGE_SIZE:-100}"
      ANIPICK_CRAWL_DELAY_MS: "${ANIPICK_CRAWL_DELAY_MS:-350}"
      ANIPICK_BGM_TIMEOUT_SEC: "${ANIPICK_BGM_TIMEOUT_SEC:-40}"
      ANIPICK_REFRESH_TTL_DAYS: "${ANIPICK_REFRESH_TTL_DAYS:-30}"
      ANIPICK_REFRESH_BATCH: "${ANIPICK_REFRESH_BATCH:-300}"
      ANIPICK_INCREMENTAL_PAGES: "${ANIPICK_INCREMENTAL_PAGES:-10}"
      ANIPICK_INCREMENTAL_INTERVAL_MIN: "${ANIPICK_INCREMENTAL_INTERVAL_MIN:-360}"
      ANIPICK_AUTO_INCREMENTAL: "${ANIPICK_AUTO_INCREMENTAL:-true}"
      ANIPICK_AUTO_REFRESH: "${ANIPICK_AUTO_REFRESH:-true}"
      ANIPICK_PRUNE_ON_FULL: "${ANIPICK_PRUNE_ON_FULL:-true}"
      ANIPICK_DEBUG: "${ANIPICK_DEBUG:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

volumes:
  pgdata:
