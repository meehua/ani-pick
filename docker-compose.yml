name: anipick

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # 按机器规格调整（默认按 1GB 内存机校准）：换大机器时在 .env 提高
    # PG_MAX_CONNECTIONS / PG_SHARED_BUFFERS / PG_EFFECTIVE_CACHE_SIZE
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-256MB}
      # 站点全是毫秒级短查询，JIT 编译开销大于收益（2 核超售机上每次语句都白烧 CPU）
      - -c
      - jit=off
    environment:
      POSTGRES_DB: ani_pick
      POSTGRES_USER: ani_pick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ani_pick}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ani_pick -d ani_pick"]
      interval: 5s
      timeout: 3s
      retries: 20

  anipick:
    image: ${ANIPICK_IMAGE:-ghcr.io/meehua/ani-pick}:${ANIPICK_IMAGE_TAG:-latest}
    # 本地源码构建：注释掉上面的 image，取消下面一行注释
    # build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ANIPICK_PORT:-8787}:8787"
    environment:
      ANIPICK_ADDR: ":8787"
      # Go 堆内存上限：小内存机器防 OOM（Go GC 到达上限即加速回收），默认 192MiB
      GOMEMLIMIT: "${GOMEMLIMIT:-192MiB}"
      # 容器内必须走 compose 的 postgres 服务，而不是 .env 里的 127.0.0.1
      ANIPICK_DATABASE_URL: "postgres://ani_pick:${POSTGRES_PASSWORD:-ani_pick}@postgres:5432/ani_pick?sslmode=disable"
      ANIPICK_ADMIN_PASSWORD: "${ANIPICK_ADMIN_PASSWORD:-anipick}"
      ANIPICK_SECRET: "${ANIPICK_SECRET:-}"
      ANIPICK_DEBUG: "${ANIPICK_DEBUG:-false}"
      # 运行期业务配置（数据源/凭据/抓取参数/出站网络/真实 IP）全部在管理后台调整，
      # 不经环境变量；基础设施规格（连接池/HTTP 超时）按需在 .env 里覆写默认值。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

volumes:
  pgdata:
