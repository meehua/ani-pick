name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to release." >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build info and release notes
        id: info
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          # 与参考工作流一致：用 git log 生成发版日志，而不是 GitHub 自动分类。
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "## 容器镜像"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            if [[ "$VERSION" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo '```'
            echo
            echo "## 变更"
            echo
            if [ -z "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$TAG"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            fi
            echo
            if [ -n "$PREV" ]; then
              echo
              echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > RELEASE_NOTES.md
          if ! grep -q '^- ' RELEASE_NOTES.md; then
            printf '\n- 无变更记录\n' >> RELEASE_NOTES.md
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "date=$DATE"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p internal/server/dist
          find internal/server/dist -mindepth 1 ! -name '.gitkeep' -delete
          cp -r frontend/dist/. internal/server/dist/

      - name: Vet and test
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.info.outputs.version }}
          COMMIT: ${{ steps.info.outputs.commit }}
          BUILD_DATE: ${{ steps.info.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          export CGO_ENABLED=0
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"

          build() {
            local goos="$1" goarch="$2" goarm="${3:-}" out="$4"
            echo "build ${goos}/${goarch}${goarm:+v$goarm}"
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -mod=readonly -trimpath -buildvcs=false \
              -ldflags "$LDFLAGS" -o "$out" .
          }

          build linux amd64 "" dist/anipick-linux-amd64
          build linux arm64 "" dist/anipick-linux-arm64
          build linux arm 7 dist/anipick-linux-armv7
          build windows amd64 "" dist/anipick-windows-amd64.exe
          build windows arm64 "" dist/anipick-windows-arm64.exe
          build darwin amd64 "" dist/anipick-darwin-amd64
          build darwin arm64 "" dist/anipick-darwin-arm64

          (cd dist && sha256sum anipick-* > checksums.txt)
          ls -lh dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.info.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=AniPick
            org.opencontainers.image.description=Bangumi index search
            org.opencontainers.image.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.info.outputs.version }}
            COMMIT=${{ steps.info.outputs.commit }}
            BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          PRE=()
          if [[ "$TAG" == *-* ]]; then
            PRE=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md "${PRE[@]}"
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              "${PRE[@]}"
          fi
